[package]
name = "faasrail-loadgen-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FaaSRail's load generator - HTTP"
repository = "https://github.com/manos2400/faasrail"
readme = "README.md"
rust-version = "1.75.0"

[dependencies]
anyhow = "1"
argh = "0.1.12"
compact_str = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { workspace = true }

faasrail-loadgen = { path = "../faasrail-loadgen" }

